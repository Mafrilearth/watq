<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <!-- Watq Official App Icon (Apple iOS / Android / macOS Squircle 512x512) -->
  <defs>
    <radialGradient id="appIconBg" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D16" />
    </radialGradient>
    <linearGradient id="appIconBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.24)" />
      <stop offset="100%" stop-color="rgba(56,189,248,0.12)" />
    </linearGradient>
    <linearGradient id="iconFacet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="iconFacet2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="iconFacet3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
  </defs>

  <!-- iOS squircle curvature -->
  <rect width="512" height="512" rx="116" fill="url(#appIconBg)" />
  <rect x="1.5" y="1.5" width="509" height="509" rx="114.5" stroke="url(#appIconBorder)" stroke-width="3" />

  <!-- The Psychometric Prism centered within 512x512 boundary -->
  <g transform="translate(6, 6)">
    <path d="M 90 150 L 150 150 L 210 325 L 165 350 L 90 150 Z" fill="url(#iconFacet1)" />
    <path d="M 215 175 L 285 175 L 250 350 L 215 175 Z" fill="url(#iconFacet2)" />
    <path d="M 350 150 L 410 150 L 335 350 L 290 325 L 350 150 Z" fill="url(#iconFacet3)" />
  </g>
</svg>
